[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "marinelab"
version = "0.2.0"
description = "A general-purpose underwater-vehicle (UUV) environment framework for Isaac Lab."
requires-python = ">=3.10"
dependencies = ["gymnasium", "torch", "numpy"]

[tool.setuptools.packages.find]
include = ["marinelab*"]

[project.entry-points."isaaclab.extensions"]
marinelab = "marinelab"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "C90",    # mccabe complexity
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
]

ignore = [
    "E402",   # Module level import not at top of file
    "D401",   # First line should be in imperative mood
    "RET504", # Unnecessary variable assignment before return statement
    "RET505", # Unnecessary elif after return statement
    "SIM102", # Use a single if-statement instead of nested if-statements
    "SIM103", # Return the negated condition directly
    "SIM108", # Use ternary operator instead of if-else statement
    "SIM117", # Merge with statements for context managers
    "SIM118", # Use {key} in {dict} instead of {key} in {dict}.keys()
    "UP006",  # Use 'dict' instead of 'Dict' type annotation
    "UP018",  # Unnecessary `float` call (rewrite as a literal)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py files

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["marinelab"]

# Custom import sections, matching isaaclab's convention (marinelab is an isaaclab extension)
section-order = [
    "future",
    "standard-library",
    "third-party",
    # Group omniverse extensions separately since they are run-time dependencies
    "omniverse-extensions",
    # Group isaaclab imports together since marinelab is an isaaclab extension
    "isaaclab",
    "isaaclab-rl",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"omniverse-extensions" = ["isaacsim", "omni", "pxr", "carb", "usdrt", "Semantics", "curobo"]
"isaaclab" = ["isaaclab"]
"isaaclab-rl" = ["isaaclab_rl"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["marinelab"]
exclude = [
    "**/__pycache__",
    "**/docs",
    ".git",
]

typeCheckingMode = "basic"
pythonVersion = "3.10"
pythonPlatform = "Linux"
enableTypeIgnoreComments = true

# Isaac Sim modules are not pip-installed in this repo; ignore missing imports.
reportMissingImports = "none"
reportMissingModuleSource = "none"
reportGeneralTypeIssues = "none"
reportOptionalMemberAccess = "warning"
reportPrivateUsage = "warning"
