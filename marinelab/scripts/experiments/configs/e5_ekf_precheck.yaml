# E5 precheck: EKF-in-loop state source (sim-to-real gate, docs/README.md §3-6).
# Identical protocol to e1_nominal.yaml (same task/steps/seeds) with state: ekf,
# so each cell is directly comparable to its GT twin in experimental_results/e1.
# nominal is included as an optional reference to separate "EKF alone" from
# "EKF x online-learner interaction" if the ssi cells degrade.
exp: e5_ekf

defaults:
  task: Isaac-PKRC-WallScan-Stage3-Direct-v0
  steps: 9000
  score_episode: 0
  state: ekf
  num_envs: 1

conditions:
  nominal: {}
  # Measured sensor model from the 2026-08-06 hero_ws bag: real noise floors AND real update
  # rates (DVL 9.5 Hz, depth 5 Hz, wall 9.5 Hz, UKF-M 31.5 Hz) via SimSensorStream
  # rate-and-hold. See docs/experiments/hw_sensor_characterization.md.
  measured:
    sensors: hw2026bag
  # As above, plus the UKF-M absolute channel measured from the marker-visible 122531 bag:
  # ArUco fixes at ~1.3 Hz with 6.5 cm median innovation (NOT the 31.5 Hz odom stream).
  # This is the condition that most honestly represents the real vehicle.
  measured_aruco:
    sensors: hw2026bag_aruco
    ukfm_theta: false   # pre-s-fix estimator baseline (fix landed 2026-08-09); keep reproducible
  # Same sensors, with the estimator actually USING the fix's absolute bearing to correct the
  # arc-length state (wall_frame_ekf.update_ukfm s_meas channel) — the s-drift fix.
  measured_aruco_sfix:
    sensors: hw2026bag_aruco
    ukfm_theta: true
  # As sfix, with the MEASURED marker-visibility limit (7 m, robot team 2026-08-09): with
  # the depth_below_surface gate the fix goes blind below z = 3 m, so the scan's bottom
  # band (z_bottom = 1.0) coasts on dead reckoning. The E5 go/no-go condition.
  measured_aruco_sfix_vis7:
    sensors: hw2026bag_aruco
    ukfm_theta: true
    ukfm_max_depth: 7.0

methods:
  nominal:
    tam: fixed
  # diff added 2026-08-18 (advanced_experiments_todo §C / concern C-2): zero-shot V8a
  # under the EKF+vis7 perception stack — the mandatory gate before E5 includes diff.
  # New metrics files only; existing nominal/ssi records untouched.
  diff:
    tam: fixed
    ckpt: checkpoints/diff_wmpc/policy_final.pt
  ssi:
    tam: fixed
    params_json: experimental_results/tuning/bo_nmpc/best_params.json  # §6: inherits BO cost weights
    # adopted ssi_mpc attempt-2 (re-based, multi-seed) trial 87 — same as e1_nominal.yaml:
    ssi_lr: 0.14733286466312384
    ssi_kernel_std: 0.18398034704266503

seeds: [0, 1, 2, 3, 4]
