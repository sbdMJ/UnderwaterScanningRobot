# E1: nominal-condition main comparison (docs/experiments_plan.md, Table 1).
# Protocol: unified full-length first episode (runner zeroes episode_length_buf),
# 9000 steps = one 180 s episode window per seed, score_episode 0, GT state (Phase 2a).
exp: e1

defaults:
  task: Isaac-PKRC-WallScan-Stage3-Direct-v0
  steps: 9000
  score_episode: 0
  state: gt
  num_envs: 1

conditions:
  nominal: {}

methods:
  fixed:
    tam: fixed
  bo:
    tam: fixed
    params_json: results/tuning/bo_nmpc/best_params.json   # produced by tune.py (P2)
  diff:
    tam: fixed
    ckpt: checkpoints/diff_wmpc/policy_final.pt
  ppo:
    num_envs: 8            # policy inference is parallel; 8 trials per seed
    policy: checkpoints/exported/policy.pt   # written by play.py on checkpoint load
  ssi:
    tam: fixed
    params_json: results/tuning/bo_nmpc/best_params.json  # §6: inherits BO cost weights
    # set from results/tuning/ssi_mpc/best_params.json after tune.py --config tune_ssi_mpc.yaml:
    ssi_lr: 0.1
    ssi_kernel_std: 1.0

seeds: [0, 1, 2, 3, 4]
