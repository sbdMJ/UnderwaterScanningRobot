# E3: ocean-current disturbance adaptation (docs/experiments_plan.md, SHOULD).
# Nominal physics (Stage3) + injected current profiles: abrupt reversal (SSI-MPC's
# ground-effect analogue) and one sinusoidal condition. Methods per plan: proposed,
# SSI-MPC, Fixed-W (model adaptation is SSI's home ground — report honestly).
exp: e3

defaults:
  task: Isaac-PKRC-WallScan-Stage3-Direct-v0
  steps: 9000
  score_episode: 0
  state: gt
  num_envs: 1
  tam: fixed

conditions:
  step:
    current: {type: step, speed: 0.15, heading_deg: 0.0, t_switch: 90.0, mode: reverse}
  sine:
    current: {type: sine, speed: 0.15, heading_deg: 0.0, period: 30.0}

methods:
  nominal: {}
  ssi:
    params_json: experimental_results/tuning/bo_nmpc/best_params.json
    ssi_lr: 0.1          # <- experimental_results/tuning/ssi_mpc/best_params.json
    ssi_kernel_std: 1.0
  diff:
    ckpt: checkpoints/diff_wmpc/policy_final.pt

seeds: [0, 1, 2]
