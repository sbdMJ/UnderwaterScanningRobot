# C-9 gate RERUN after merging feature/sim-to-real-e5-depthhold (3e8d613): the depth-hold
# campaign changed shared controller code — mpc_controller.py (actuator-rate model nx 13+6,
# command-latency predictor) and ssi_controller.py (latency-aligned learner FIFO, d clamp,
# injection low-pass). All are opt-in with legacy sim defaults (force_rate_limit=None,
# command_latency_s=0, clamp inf, tau 0), so the recorded cells must still reproduce.
# Same two gate cells as c9_regress.yaml; own exp dir — never overwrite records.
#   gate 1 (ssi path, exercises the changed ssi_controller): ssi x measured_aruco_sfix s4 -> 96.722
#   gate 2 (diff path, exercises the changed mpc_controller): diff x nominal(GT) s0 -> 13.327
# Run:
#   run_experiment.py ssi  --cond measured_aruco_sfix --seed 4 --config .../c9b_regress.yaml
#   run_experiment.py diff --cond nominal             --seed 0 --config .../c9b_regress.yaml
exp: c9b_regress

defaults:
  task: Isaac-PKRC-WallScan-Stage3-Direct-v0
  steps: 9000
  score_episode: 0
  state: gt
  num_envs: 1

conditions:
  nominal: {}                       # diff gate: GT state, e1 twin
  measured_aruco_sfix:              # ssi gate: EKF state, e5_ekf twin
    state: ekf
    sensors: hw2026bag_aruco
    ukfm_theta: true

methods:
  diff:
    tam: fixed
    ckpt: checkpoints/diff_wmpc/policy_final.pt
  ssi:
    tam: fixed
    params_json: experimental_results/tuning/bo_nmpc/best_params.json
    ssi_lr: 0.14733286466312384
    ssi_kernel_std: 0.18398034704266503

seeds: [0, 4]   # gate cells are selected per-run via --cond/--seed
